name: Deploy Web (Frontend)

on:
  push:
    branches:
      - main
    paths:
      - 'web/**'
      - '.github/workflows/deploy-web.yml'
  workflow_dispatch:

jobs:
  deploy-web:
    name: Deploy Web
    runs-on: ubuntu-latest

    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Instalar dependências do web
        working-directory: web
        run: |
          rm -f ../package-lock.json
          npm install

      - name: Validar secrets do build
        run: |
          if [ -z "$VITE_GOOGLE_MAPS_API_KEY" ]; then
            echo "::error::Defina o secret VITE_GOOGLE_MAPS_API_KEY em Settings → Secrets → Actions (só o valor AIza..., sem aspas nem nome da variável)."
            exit 1
          fi
          case "$VITE_GOOGLE_MAPS_API_KEY" in
            AIza*) ;;
            *)
              echo "::error::VITE_GOOGLE_MAPS_API_KEY inválido: deve começar com AIza (copie só a chave do Google Cloud)."
              exit 1
              ;;
          esac
        env:
          VITE_GOOGLE_MAPS_API_KEY: ${{ secrets.VITE_GOOGLE_MAPS_API_KEY }}

      - name: Build do frontend
        working-directory: web
        run: npm run build
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          VITE_API_URL: ${{ secrets.VITE_API_URL }}
          VITE_GOOGLE_MAPS_API_KEY: ${{ secrets.VITE_GOOGLE_MAPS_API_KEY }}

      - name: Enviar dist para VPS
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT }}
          source: "web/dist/*"
          target: "/var/www/combustivel/dist/"
          strip_components: 2
